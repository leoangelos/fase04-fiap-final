[project]
name = "multimodal-monitor"
version = "0.1.0"
description = "Tech Challenge FIAP 8IADT Fase 4 — Monitoramento multimodal de pacientes (vídeo, áudio e sinais vitais) com detecção de anomalias e alertas"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "librosa>=0.10",
    "praat-parselmouth>=0.4.3",
    "soundfile>=0.12",
    "azure-cognitiveservices-speech>=1.40",
    "azure-ai-textanalytics>=5.3",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.14",
    "wfdb>=4.1",
    "streamlit>=1.40",
    "plotly>=5.24",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.6",
    "redis>=5.0",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multimodal_monitor", "src/hospital_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
